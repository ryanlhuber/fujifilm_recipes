name: Migrate recipes to individual files

on:
  push:
    branches:
      - main
    paths:
      - recipes.yml
      - scripts/split_recipes.rb
      - .github/workflows/migrate-recipes.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Split recipes
        run: ruby scripts/split_recipes.rb

      - name: Commit generated recipe files
        run: |
          if [ ! -f recipes.yml ]; then
            echo "Migration already completed."
            exit 0
          fi

          rm recipes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes generated recipes.yml

          if git diff --cached --quiet; then
            echo "No recipe migration changes to commit."
            exit 0
          fi

          git commit -m "Migrate recipes to individual files"
          git push
