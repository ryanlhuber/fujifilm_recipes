name: Generate recipe collection

on:
  push:
    branches:
      - main
    paths:
      - recipes.yml
      - recipes/**
      - scripts/split_recipes.rb
      - .github/workflows/migrate-recipes.yml
  issue_comment:
    types:
      - created

permissions:
  contents: write

jobs:
  generate:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message != 'Regenerate recipe collection') ||
      (github.event_name == 'issue_comment' && github.event.comment.body == '/regenerate-recipes')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate recipe files and combined collection
        run: ruby scripts/split_recipes.rb

      - name: Remove legacy collection
        run: rm -f recipes.yml

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes generated recipes.yml

          if git diff --cached --quiet; then
            echo "No recipe generation changes to commit."
            exit 0
          fi

          git commit -m "Regenerate recipe collection"
          git push
