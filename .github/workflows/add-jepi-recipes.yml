name: Add Jepi recipes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-jepi-recipes.yml

permissions:
  contents: write

jobs:
  update-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add recipes and update README
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          recipes_path = Path('recipes.yml')
          recipes = recipes_path.read_text()

          entries = r'''

  - name: Jepi - Warm
    camera_slot: null

    settings:
      film_simulation: Eterna/Cinema

      monochrome_color:
        wc: null
        mg: null

      grain_effect:
        roughness: Weak
        size: Large

      color_chrome_effect: Strong
      color_chrome_fx_blue: Strong
      smooth_skin_effect: Off

      white_balance:
        mode: 5600K
        red_shift: 4
        blue_shift: -6

      dynamic_range: DR400
      d_range_priority: Off

      tone_curve:
        highlights: -1
        shadows: 2

      color: 2
      sharpness: -2
      high_iso_nr: -4
      clarity: -3

    source:
      creator: Jepi

  - name: Jepi - Cold
    camera_slot: null

    settings:
      film_simulation: Eterna/Cinema

      monochrome_color:
        wc: null
        mg: null

      grain_effect:
        roughness: Weak
        size: Large

      color_chrome_effect: Strong
      color_chrome_fx_blue: Strong
      smooth_skin_effect: Off

      white_balance:
        mode: 4300K
        red_shift: 0
        blue_shift: 2

      dynamic_range: DR400
      d_range_priority: Off

      tone_curve:
        highlights: -1
        shadows: 2

      color: 2
      sharpness: -2
      high_iso_nr: -4
      clarity: -3

    source:
      creator: Jepi

  - name: Jepi - Neutral
    camera_slot: null

    settings:
      film_simulation: Eterna/Cinema

      monochrome_color:
        wc: null
        mg: null

      grain_effect:
        roughness: Weak
        size: Large

      color_chrome_effect: Strong
      color_chrome_fx_blue: Strong
      smooth_skin_effect: Off

      white_balance:
        mode: 4800K
        red_shift: 2
        blue_shift: -4

      dynamic_range: DR400
      d_range_priority: Off

      tone_curve:
        highlights: -1
        shadows: 2

      color: 2
      sharpness: -2
      high_iso_nr: -4
      clarity: -3

    source:
      creator: Jepi
'''

          if '  - name: Jepi - Warm\n' not in recipes:
              recipes_path.write_text(recipes.rstrip() + entries + '\n')

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          rows = (
              '| Jepi - Warm | Jepi |\n'
              '| Jepi - Cold | Jepi |\n'
              '| Jepi - Neutral | Jepi |\n'
          )
          if '| Jepi - Warm | Jepi |' not in readme:
              readme_path.write_text(readme.rstrip() + '\n' + rows)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/add-jepi-recipes.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes.yml README.md .github/workflows/add-jepi-recipes.yml
          git commit -m "Add Jepi LUT-derived recipes"
          git push
